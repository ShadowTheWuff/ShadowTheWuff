# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "*/15 * * * *"}]
  # (optional) Run workflow manually
#  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
  #  runs-on: ubuntu-latest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Your GitHub token
          # The following scopes are required:
          #  - public_access (default scope)
          # The following additional scopes may be required:
          #  - read:org      (for organization related metrics)
          #  - read:user     (for user related data)
          #  - read:packages (for some packages related data)
          #  - repo          (optional, if you want to include private repositories)
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: ShadowTheWuff
          template: classic
          base: header, activity, community, repositories, metadata
          config_octicon: yes
          config_timezone: America/Chicago
          plugin_music: yes
          plugin_music_limit: 4
          plugin_music_token: ${{ secrets.LASTFM_TOKEN }}
          plugin_music_mode: recent
          plugin_music_played_at: yes
          plugin_music_provider: lastfm
          plugin_music_time_range: short
          plugin_music_top_type: tracks
          plugin_music_user: .user.login
          # steam  Profile and detailed game history
   #       plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
   #       plugin_steam: yes
   #       plugin_steam_user: "76561198870009584"
          # Stean Recently played games
         #  plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
         # plugin_steam: yes
         # plugin_steam_user: "76561198870009584"
         # plugin_steam_sections: recently-played
         # plugin_steam_achievements_limit: 0

         # STEAN MOST PLAYED
   #       plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
   #       plugin_steam: yes
   #       plugin_steam_user: "76561198870009584"
   #       plugin_steam_sections: recently-played
   #       plugin_steam_achievements_limit: 0
   #       plugin_steam_games_ignored: 2154650

   # steam profile
  #        plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
 #         plugin_steam: yes
  #        plugin_steam_user: "76561198870009584"
   #       plugin_steam_sections: player
          # 

        # full steam
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_user: "76561198870009584"
          plugin_steam_sections: player, most-played, recently-played
          plugin_steam_games_ignored: 2154650
          plugin_steam_achievements_limit: 0
          plugin_topics: yes
   #       filename: metrics.plugin.topics.icons.svg
          plugin_topics_mode: icons
          plugin_topics_sort: stars
          # 16personalities
          plugin_16personalities: yes
          plugin_16personalities_url: ${{ secrets.SIXTEEN_PERSONALITIES_URL }}
          plugin_16personalities_sections: personality, traits
          plugin_16personalities_scores: no

          # notale
          plugin_notable: yes
          plugin_notable_types: commit, pull_request, issue
          
          plugin_languages: yes
          plugin_languages_sections: recently-used
          plugin_languages_recent_load: 400
          plugin_languages_recent_days: 14

          plugin_wakatime: yes
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors, os
          plugin_wakatime_token: ${{ secrets.PLUGIN_WAKATIME_TOKEN }}
